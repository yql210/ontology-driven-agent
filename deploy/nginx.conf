# OntoAgent Nginx 配置
# 开发模式: 只用 HTTP (listen 80)
# 生产模式: 启用 HTTPS + 限流 + 安全头
# 切换方法: 设置环境变量 ONTOAGENT_NEBULA_PASSWORD 等, 或直接修改此文件

# ===== Rate Limiting Zone (生产环境取消注释) =====
# limit_req_zone $binary_remote_addr zone=ontoagent_api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=ontoagent_chat:10m rate=2r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：所有前端路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://ontoagent-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（/chat/stream）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # 限流（生产环境取消注释）
        # limit_req zone=ontoagent_api burst=20 nodelay;
    }

    # Chat 端点专用限流（LLM 调用成本高）
    location /api/chat {
        proxy_pass http://ontoagent-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # 限流（生产环境取消注释）
        # limit_req zone=ontoagent_chat burst=5 nodelay;
    }

    # 健康检查
    location /health {
        proxy_pass http://ontoagent-web:8000;
    }

    # Prometheus metrics（限内网访问）
    location /metrics {
        proxy_pass http://ontoagent-web:8000;
        # 生产环境: 只允许 Prometheus scraper IP
        # allow 10.0.0.0/8;
        # deny all;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 生产 HTTPS 配置（取消注释并配置证书路径）
    # listen 443 ssl http2;
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    # HTTP → HTTPS 重定向（生产环境）
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }
}
