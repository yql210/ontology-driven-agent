# OntoAgent CI Pipeline
# 在每次 push/PR 时执行 P7 质量门禁。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: # 手动触发（可跑集成测试）

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ matrix.python-version }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-uv-

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Pyright type check
        run: uv run pyright src/ || true  # 非阻塞（第三方库类型缺失是常态）

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Run Golden evaluator
        run: uv run pytest tests/evaluation/open_service_graph/test_open_service_graph_eval.py -v
      - name: Run Java RPC public evaluation gate
        run: uv run pytest tests/evaluation/java_rpc_contracts/test_java_rpc_contract_eval.py -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend smoke
        run: npm run smoke
      - name: Frontend build
        run: npm run build

  secret-marker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for secrets and internal markers
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files | grep -Ev '(^|/)(\.env\.example|.*\.lock)$' || true)
          if [ -z "$files" ]; then exit 0; fi
          if grep -Ein '(sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' $files; then
            echo "Potential secret found in tracked files" >&2
            exit 1
          fi
          if grep -Ein '(^|[^A-Za-z])(INTERNAL_ONLY|INTERNAL_MARKER|DO_NOT_SHIP)([^A-Za-z]|$)' $files; then
            echo "Internal marker found in tracked files" >&2
            exit 1
          fi

  integration-test:
    # Requires repository secrets configured for the remote Neo4j service.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Require remote Neo4j configuration
        env:
          NEO4J_URI: ${{ secrets.ONTOAGENT_NEO4J_URI }}
          NEO4J_USER: ${{ secrets.ONTOAGENT_NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.ONTOAGENT_NEO4J_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NEO4J_URI" -a -n "$NEO4J_USER" -a -n "$NEO4J_PASSWORD" || {
            echo "Remote Neo4j integration gate requires ONTOAGENT_NEO4J_URI/USER/PASSWORD repository secrets" >&2
            exit 1
          }

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short
        env:
          ONTOAGENT_NEO4J_URI: ${{ secrets.ONTOAGENT_NEO4J_URI }}
          ONTOAGENT_NEO4J_USER: ${{ secrets.ONTOAGENT_NEO4J_USER }}
          ONTOAGENT_NEO4J_PASSWORD: ${{ secrets.ONTOAGENT_NEO4J_PASSWORD }}
